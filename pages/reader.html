<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D8E2C8">
  <title>小说阅读器</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <!-- 主布局 -->
  <div class="reader-layout">
    <!-- 左侧目录栏 -->
    <aside class="toc-sidebar" id="tocSidebar">
      <div class="toc-header">
        <h1 id="bookTitle">加载中...</h1>
        <button class="close-toc" id="closeToc" aria-label="关闭目录">×</button>
      </div>
      <div class="toc-meta hidden" id="tocMeta">
        <div class="toc-meta-line hidden" id="tocMetaLine"></div>
        <div class="toc-intro hidden" id="tocIntro">
          <button class="toc-intro-toggle" id="tocIntroToggle" aria-expanded="false">
            <span>简介</span><span class="toc-intro-arrow" id="tocIntroArrow">▾</span>
          </button>
          <div class="toc-intro-body hidden" id="tocIntroBody"></div>
        </div>
      </div>
      <ul class="toc-list" id="tocList">
        <!-- 章节列表 -->
      </ul>
    </aside>

    <!-- 主内容区 -->
    <main class="reader-main" id="readerMain">
      <div class="reader-content-wrapper">
        <div id="content" class="chapter-content">
          <!-- 段落内容 -->
        </div>
      </div>
    </main>
  </div>

  <!-- 浮动操作按钮 -->
  <div class="reader-actions">
    <button class="action-btn hidden" id="notesBtn" title="本章段评" aria-label="本章段评">💬</button>
    <button class="action-btn" id="settingsBtn" title="设置 (s)" aria-label="阅读设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
      </div>

  <!-- 设置面板 (整合朗读功能) -->
  <div class="settings-overlay hidden" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="阅读设置">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>阅读设置</h2>
        <button class="close-settings" id="closeSettings" aria-label="关闭设置">×</button>
      </div>

      <div class="settings-section">
        <h3>外观</h3>
        <div class="settings-group">
          <label>字体</label>
          <input type="text" id="fontFamily" placeholder="如：XHei Intel、Source Han Serif SC" value="">
        </div>
        <div class="settings-group">
          <label>字体大小</label>
          <div class="font-size-control">
            <button class="size-btn" id="fontDecrease">-</button>
            <span class="font-size-value" id="fontSizeValue">18px</span>
            <button class="size-btn" id="fontIncrease">+</button>
          </div>
        </div>
        <div class="settings-group">
          <label>行高 <span id="lineHeightValue">1.8</span></label>
          <input type="range" id="lineHeightSlider" min="1.2" max="2.5" step="0.1" value="1.8">
        </div>
      </div>

      <div class="settings-section">
        <h3>朗读</h3>
        <div class="speech-controls">
          <button class="speech-btn" id="speechStart">开始朗读</button>
          <button class="speech-btn" id="speechPause" style="display:none;">暂停</button>
          <button class="speech-btn" id="speechStop" style="display:none;">停止</button>
        </div>
        <div class="speech-info">
          <span id="speechStatus">就绪</span>
        </div>
        <div class="speech-options">
          <label>
            语速: <input type="range" id="speechRate" min="0.5" max="3" step="0.1" value="1">
            <span id="speechRateValue">1</span>
          </label>
          <label>
            音高: <input type="range" id="speechPitch" min="0" max="2" step="0.1" value="1">
            <span id="speechPitchValue">1</span>
          </label>
          <select id="speechVoice">
            <option value="">默认语音</option>
          </select>
        </div>
      </div>

      <div class="settings-section">
        <h3>自动滚动</h3>
        <div class="settings-group">
          <div class="auto-read-options">
            <label><input type="radio" name="autoRead" value="off" checked> 关闭</label>
            <label><input type="radio" name="autoRead" value="30"> 30秒/页</label>
            <label><input type="radio" name="autoRead" value="60"> 60秒/页</label>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h3>自定义样式</h3>
        <div class="settings-group">
          <textarea id="extraCss" rows="3" placeholder="body { -webkit-text-stroke: 0.5px; }"></textarea>
        </div>
      </div>


      <button class="btn-save" id="saveSettings">保存</button>
    </div>
  </div>

  
  <!-- Toast 提示 -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite">提示信息</div>

  <!-- 段评抽屉 -->
  <aside class="notes-drawer hidden" id="notesDrawer" role="dialog" aria-modal="true" aria-label="段评">
    <div class="notes-drawer-header">
      <div class="notes-drawer-heading">
        <div class="notes-drawer-title" id="notesDrawerTitle">段评</div>
        <div class="notes-drawer-sub" id="notesDrawerSub"></div>
      </div>
      <button class="close-notes" id="closeNotes" title="关闭 (Esc)" aria-label="关闭段评">×</button>
    </div>
    <div class="notes-drawer-body" id="notesDrawerBody"></div>
  </aside>

  <script src="../shared/utils.js" type="module"></script>
  <script src="../shared/zhTables.js" type="module"></script>
  <script src="../shared/constants.js" type="module"></script>
  <script src="../shared/storage.js" type="module"></script>
  <script src="reader.js" type="module"></script>
</body>
</html>
